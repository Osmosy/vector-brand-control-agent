name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation and composition
        run: python3 scripts/validate.py
      - name: Run scorer tests
        run: python3 -m unittest discover -s tests -q
      - name: Smoke-run the scorer on the sample
        run: python3 skills/vector-brand-control-agent/scripts/geo_score.py --measurements skills/vector-brand-control-agent/templates/measurements-sample.csv --prompts skills/vector-brand-control-agent/templates/prompts.csv
